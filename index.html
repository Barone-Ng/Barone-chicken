<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barone's chicken yard</title>

<style>
  /* ---------- Colors & page frame ---------- */
  :root {
    --bg: #14110d;
    --ink: #fff7e6;
    --dock: rgba(40, 28, 16, .8);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0b08; } }
  :root[data-theme="dark"] { --bg: #0d0b08; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font: 600 13px ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
  }

  /* ---------- Game area (16:9) ---------- */
  #w { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; touch-action: none; cursor: crosshair; }

  /* ---------- UI panels (title, hint, bottom dock) ---------- */
  .ui {
    position: absolute;
    background: var(--dock);
    color: var(--ink);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    transition: opacity .4s;
  }
  #w.off .ui { opacity: 0; pointer-events: none; }        /* "Hide UI" button */
  #tl   { left: 2%; top: 3%; font-weight: 800; letter-spacing: .12em; }
  #hint { left: 50%; top: 3%; transform: translateX(-50%); }
  #dock { left: 50%; bottom: 3%; transform: translateX(-50%); flex-direction: column; gap: 4px; width: max-content; max-width: 96%; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 10px; }
  .ctr { display: flex; align-items: center; gap: 4px; }       /* one "− 6 + hens" group */

  button { font: inherit; color: inherit; background: none; border: 0; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, .12); }
  button:focus-visible { outline: 2px solid #ffd23f; }
  kbd { font: inherit; font-size: 10px; background: rgba(255, 255, 255, .15); border-radius: 5px; padding: 1px 5px; margin-left: 4px; }
  .sep { width: 1px; height: 16px; background: rgba(255, 255, 255, .25); }

  @media (max-width: 640px) {
    kbd { display: none; }
    #dock { padding: 6px 8px; font-size: 12px; }
    .row { gap: 2px 6px; }
    .sep { display: none; }
  }
</style>
</head>

<body>
<div id="w">
  <canvas id="c" aria-label="Interactive chicken yard: tap to scare the chickens"></canvas>
  <div class="ui" id="tl">hiyoko</div>
  <div class="ui" id="hint">Tap the yard to scare the flock. Tap a chicken to pet it, drag to carry it</div>
  <div class="ui" id="dock">
    <div class="row">
      <span class="ctr"><button id="hen-less" aria-label="Fewer hens">−</button><b id="hen-count">6</b><button id="hen-more" aria-label="More hens">+</button><span>hens</span></span>
      <span class="ctr"><button id="rooster-less" aria-label="Fewer roosters">−</button><b id="rooster-count">1</b><button id="rooster-more" aria-label="More roosters">+</button><span>roosters</span></span>
      <span class="ctr"><button id="chick-less" aria-label="Fewer chicks">−</button><b id="chick-count">14</b><button id="chick-more" aria-label="More chicks">+</button><span>chicks</span></span>
      <span class="ctr"><span>eggs</span><b id="egg-count">0</b></span>
    </div>
    <div class="row">
      <button id="sc">Scatter<kbd>Space</kbd></button>
      <button id="fd">Feed<kbd>F</kbd></button>
      <button id="hk">Hawk<kbd>K</kbd></button>
      <i class="sep"></i>
      <button id="rn">Sunny</button>
      <button id="tm">Time: Auto</button>
      <button id="snd">Sound: On</button>
      <i class="sep"></i>
      <button id="ps">Pause<kbd>P</kbd></button>
      <button id="cam">Photo<kbd>C</kbd></button>
      <button id="hd">Hide UI<kbd>H</kbd></button>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   1. SETTINGS  –  the easy-to-tweak numbers. Change these first!
   (speeds are in pixels per second on a 480 x 270 canvas)
   ========================================================================== */
const SETTINGS = {

  // ----- Flock size -----
  startingHens:     6,
  startingRoosters: 1,
  startingChicks:   14,
  maxHens:          20,
  maxRoosters:      10,
  maxChicks:        40,

  // ----- Roosters -----
  roosterSize:     [1.25, 1.4],   // hens are about 0.9 - 1.15, so roosters look bigger
  crowEvery:       [12, 28],      // seconds between crows (random in this range)
  crowDuration:    1.6,           // seconds a crow lasts

  // ----- Normal walking speed (each bird picks a random value in its range) -----
  henSpeedRange:   [15, 23],
  chickSpeedRange: [30, 38],

  // ----- Scared sprint (after a tap / Scatter) -----
  scaredRunMultiplier:  3.6,   // run speed = walking speed x this
  scaredRunBoost:       2.5,   // instant kick of speed (x walking speed) at the moment they bolt
  scaredFleeTime:       1.3,   // seconds they keep pushing away from the tap point
  scaredPanicTime:      1.6,   // seconds they keep running + flapping after bolting

  // ----- Wing flapping (hens only). Wings flap ONLY after a tap on the yard. -----
  //       Normal walking / running / running to food keeps the wings folded.
  wingFlapRate:    30,         // flaps speed (radians/sec, 30 is about 5 flaps per second)
  wingFlapOpen:    0.6,        // how far wings are held open on average
  wingFlapSwing:   0.55,       // how far wings move up/down while flapping
  henHopHeight:    2,          // little hop in pixels while flapping (0 = no hop)

  // ----- Tap on screen -----
  tapScareRadius:    150,      // chickens closer than this to the tap get scared
  tapReactionSpeed:  300,      // reaction delay = distance / this (farther birds react later)

  // ----- Heading to a worm or food pellet (a little faster than a normal walk) -----
  chaseWalkMultiplier: 1.7,    // close to the food: brisk walk  = walking speed x this
  chaseRunMultiplier:  2.4,    // far from the food: quick run   = walking speed x this
  chaseRunDistance:    45,     // farther than this many pixels -> run, closer -> brisk walk
  wormSightRange:      150,    // how far a bird can spot a worm
  pelletSightRange:    220,    // how far a bird can spot a food pellet
  wormDistancePenalty: 1.5,    // worms "feel" this much farther away (birds prefer pellets)
  eatReach:            5,      // how close (px) the bird needs to be to start pecking
  peckTime:            0.8,    // seconds spent pecking one worm/pellet

  // ----- Worms -----
  wormCount:        8,         // worms kept alive in the yard
  wormGrowTime:     2.5,       // seconds for a worm to crawl out of its hole
  wormCrawlSpeed:   4,         // normal crawl speed
  wormFleeSpeed:    11,        // crawl speed when a bird is close

  // ----- Feed button -----
  pelletsPerFeed:   26,

  // ----- Eggs and growing up -----
  eggsEnabled:     true,
  layEvery:        [45, 100],  // each hen lays an egg about this often (seconds)
  layTime:         5,          // seconds a hen sits on the nest
  hatchTime:       [28, 40],   // seconds until an egg hatches
  maxEggs:         5,          // the nest tray holds this many
  growUpTime:      [90, 150],  // seconds for a hatched chick to grow up
  roosterChance:   0.3,        // chance a grown-up chick becomes a rooster (otherwise a hen)
  maxBirds:        70,         // no more eggs / hatching above this many birds

  // ----- Water, feeder and dust bath -----
  thirstEvery:     [60, 120],  // seconds until a bird wants a drink
  hungerEvery:     [70, 130],  // seconds until a bird wants to visit the feeder
  drinkTime:       2.6,
  feederTime:      3,
  dustEvery:       [50, 110],  // seconds between dust baths
  dustTime:        4,

  // ----- Rooster personality -----
  rivalEvery:      [25, 50],   // seconds between rooster fights (needs 2+ roosters)
  fightTime:       3,          // seconds one rooster chases the other
  guardRadius:     70,         // roosters stay within this distance of the hens

  // ----- Day and night -----
  dayLength:       240,        // seconds for one whole day + night
  startTime:       0.35,       // 0 = midnight, 0.25 = sunrise, 0.5 = noon, 0.75 = sunset
  nightTint:       0.55,       // how dark the night is (0 - 1)

  // ----- Hawk (press the Hawk button / K) -----
  hawkSpeed:       120,
  hawkScareRadius: 80,         // chickens this close to the hawk's shadow bolt and flap

  // ----- Rain & lightning -----
  thunderShockRadius: 80,      // birds this close to a lightning strike get paralyzed
  thunderScareRadius: 170,     // birds this close (but outside shock radius) run away
};


/* ==========================================================================
   2. SMALL HELPER FUNCTIONS
   ========================================================================== */
const WIDTH = 480, HEIGHT = 270;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const byId = id => document.getElementById(id);

canvas.width = WIDTH;
canvas.height = HEIGHT;
ctx.imageSmoothingEnabled = false;

// Seeded random generator (same seed = same yard every time).
const makeRandom = seed => () => {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
const staticRandom = makeRandom(7);    // used only for the one-time ground painting
const liveRandom   = makeRandom(42);   // used while the game is running

// Steady "random" number for a pixel position (same input = same output, so the art never changes)
const noise = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;

const pickFrom = (random, list) => list[random() * list.length | 0];
const clamp    = (v, min, max) => Math.max(min, Math.min(max, v));
const between  = (range) => range[0] + liveRandom() * (range[1] - range[0]);

// Keep an angle inside -PI .. +PI
const wrapAngle = a => {
  while (a >  Math.PI) a -= 6.2832;
  while (a < -Math.PI) a += 6.2832;
  return a;
};

// Create an off-screen canvas the same size as the game. Returns [canvas, context].
const makeLayer = () => {
  const c = document.createElement('canvas');
  c.width = WIDTH; c.height = HEIGHT;
  return [c, c.getContext('2d')];
};

// Draw a filled pixel-art circle (no anti-aliasing).
const drawDisc = (c, x, y, radius, color) => {
  c.fillStyle = color;
  x = Math.round(x); y = Math.round(y);
  const n = Math.ceil(radius);
  for (let j = -n; j <= n; j++) {
    if (j * j > radius * radius) continue;
    const halfWidth = Math.floor(Math.sqrt(radius * radius - j * j));
    c.fillRect(x - halfWidth, y + j, 2 * halfWidth + 1, 1);
  }
};

// Make a tiny canvas and let `paint` draw on it (used for the chicken body parts).
const makeSprite = (w, h, paint) => {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  paint(c.getContext('2d'));
  return c;
};


/* ==========================================================================
   2b. SOUND  –  little sounds made with the browser's audio (no files to load)
   Sound starts after your first tap/click (browsers require that) and can be muted with the Sound button.
   ========================================================================== */
const Sound = (() => {
  let ac = null, master = null, noiseBuffer = null, on = true;
  const last = {};                                   // when each sound last played (so they never pile up)
  const gate = (name, gap) => {                      // returns false if this sound played too recently
    if (!ac) return false;
    if (ac.currentTime - (last[name] || -9) < gap) return false;
    last[name] = ac.currentTime;
    return true;
  };

  // A simple beep that can slide from one pitch to another
  function tone(freq, dur, o = {}) {
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(o.vol ?? .1, t + Math.min(.02, dur / 3));
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let out = osc;
    if (o.lowpass) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lowpass; osc.connect(f); out = f; }
    out.connect(gain); gain.connect(master);
    if (o.vibrato) {                                  // wobbling pitch (used for the long crow)
      const lfo = ac.createOscillator(), lfoGain = ac.createGain();
      lfo.frequency.value = o.vibrato; lfoGain.gain.value = freq * .035;
      lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start(t); lfo.stop(t + dur + .05);
    }
    osc.start(t); osc.stop(t + dur + .05);
  }

  // A burst of noise (wind, thunder, pecks)
  function noise(dur, o = {}) {
    if (!noiseBuffer) {
      noiseBuffer = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    const t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(), filter = ac.createBiquadFilter(), gain = ac.createGain();
    src.buffer = noiseBuffer;
    filter.type = o.filter || 'bandpass';
    filter.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.sweepTo) filter.frequency.exponentialRampToValueAtTime(o.sweepTo, t + dur);
    gain.gain.setValueAtTime(.0001, t);
    gain.gain.exponentialRampToValueAtTime(o.vol ?? .1, t + Math.min(.03, dur / 3));
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(filter); filter.connect(gain); gain.connect(master);
    src.start(t, Math.random()); src.stop(t + dur + .05);
  }

  return {
    // call this from a tap / key press (browsers only allow sound after that)
    unlock() {
      if (!ac) {
        const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
        if (!AC) return;
        try { ac = new AC(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); } catch (e) { ac = null; }
      }
      if (ac && ac.state === 'suspended') ac.resume();
    },
    get isOn() { return on; },
    setOn(value) { on = value; },
    toggle() { on = !on; return on; },

    // ---- the sounds (each one checks that sound is on and unlocked) ----
    crow() {                                          // cock-a-doodle-doo
      if (!on || !gate('crow', 1.2)) return;
      const p = .9 + Math.random() * .25, o = { type: 'sawtooth', vol: .06, lowpass: 2400 };
      tone(520 * p, .16, { ...o, to: 700 * p });
      tone(680 * p, .12, { ...o, to: 560 * p, delay: .17 });
      tone(640 * p, .2,  { ...o, to: 900 * p, delay: .3 });
      tone(900 * p, .6,  { ...o, to: 620 * p, delay: .52, vibrato: 9 });
    },
    cluck() {
      if (!on || !gate('cluck', .45)) return;
      const f = 240 + Math.random() * 70;
      tone(f, .06, { type: 'square', to: f * .65, vol: .03, lowpass: 900 });
      tone(f * 1.1, .05, { type: 'square', to: f * .7, vol: .025, lowpass: 900, delay: .09 });
    },
    peck() { if (on && gate('peck', .09)) noise(.025, { freq: 1800, vol: .05 }); },
    drink() { if (on && gate('drink', .25)) tone(500 + Math.random() * 200, .05, { to: 900, vol: .03 }); },
    pip()   { if (on && gate('pip', .1)) { tone(880, .08, { vol: .07 }); tone(1320, .1, { vol: .07, delay: .08 }); } },        // egg laid
    peep()  { if (on && gate('peep', .1)) { tone(1500, .07, { to: 2100, vol: .05 }); tone(1700, .07, { to: 2300, vol: .05, delay: .1 }); } },
    squeak(){ if (on && gate('squeak', .12)) tone(1200, .08, { to: 1750, vol: .06 }); },
    whoosh(){ if (on && gate('whoosh', .2)) noise(.25, { freq: 900, sweepTo: 2500, vol: .07 }); },
    click() { if (on && gate('click', .1)) noise(.03, { freq: 3000, vol: .12 }); },
    thunder() {
      if (!on || !gate('thunder', .5)) return;
      noise(.14, { freq: 2500, vol: .22 });
      noise(1.8, { filter: 'lowpass', freq: 500, sweepTo: 90, vol: .55, delay: .05 });
    },
    screech() {
      if (!on || !gate('screech', 1)) return;
      tone(2300, .55, { type: 'sawtooth', to: 1400, vol: .04, lowpass: 3600 });
      tone(2000, .4, { type: 'sawtooth', to: 1300, vol: .035, lowpass: 3600, delay: .3 });
    },
  };
})();


/* ==========================================================================
   3. THE YARD  –  ground, bushes, sunflowers, fences, coop (painted ONCE)
   ========================================================================== */

// Layers:  ground = under everything,  birdShadow = redrawn each frame,
//          canopy = drawn OVER the birds (bush tops, coop),  staticShadow = temporary
const [groundCanvas,       ground]       = makeLayer();
const [birdShadowCanvas,   birdShadow]   = makeLayer();
const [canopyCanvas,       canopy]       = makeLayer();
const [staticShadowCanvas, staticShadow] = makeLayer();

// ---------- Colors used by the ground ----------
const DIRT_SHADES  = ['#97703f', '#a3794a', '#b08354', '#bc9060', '#c79b6a'];     // dark ... light packed dirt
const GRASS_SHADES = ['#5f9440', '#6fa24b', '#7bae52', '#86b85c', '#93c565'];     // dark ... light grass
const STRAW_COLORS = ['#e3c35c', '#f1da7e', '#c9a53f', '#d9b64a'];
const RUT_DEEP = '#7a5532', RUT_MID = '#8e6740', RUT_LIT = '#d6b080';

// Ground settings you can tweak
const GROUND = {
  grassThreshold: .6,          // higher = less grass (0.5 lots of grass ... 0.8 almost none)
  grassEdgeAmount: .72,        // how much extra grass grows around the outside of the yard
  rutPath: [[-12, 214], [110, 244], [250, 158], [392, 196]],   // wheel ruts: 4 curve points [x, y] (left edge -> coop)
  rutSpacing: 5.5,             // distance from the middle of the track to each wheel groove
  pebbleCount: 70,
  tuftCount: 260,
  flowerCount: 34,
  strawScattered: 220,         // loose straw pieces spread over the dirt
  strawClumps: [[90, 190], [170, 90], [300, 200], [330, 110], [210, 60], [60, 120], [402, 180]],   // piles of straw: [x, y]
};

// --- 3a. Soft noise: makes natural-looking blotches instead of random static ---
const NOISE_SIZE = 64;
const makeNoiseGrid = () => Float32Array.from({ length: NOISE_SIZE * NOISE_SIZE }, () => staticRandom());
const dirtNoise = makeNoiseGrid(), grassNoise = makeNoiseGrid(), islandNoise = makeNoiseGrid();
const smoothStep = t => t * t * (3 - 2 * t);
function valueNoise(grid, x, y, scale) {
  const gx = x / scale, gy = y / scale, ix = Math.floor(gx), iy = Math.floor(gy);
  const fx = smoothStep(gx - ix), fy = smoothStep(gy - iy);
  const at = (i, j) => grid[(j & 63) * NOISE_SIZE + (i & 63)];
  const top    = at(ix, iy)     + (at(ix + 1, iy)     - at(ix, iy))     * fx;
  const bottom = at(ix, iy + 1) + (at(ix + 1, iy + 1) - at(ix, iy + 1)) * fx;
  return top + (bottom - top) * fy;
}
const layeredNoise = (grid, x, y, scale) =>        // big blotches + medium + fine detail
  valueNoise(grid, x, y, scale) * .6 + valueNoise(grid, x + 31, y + 17, scale / 2.1) * .3 + valueNoise(grid, x + 77, y + 53, scale / 4.3) * .1;

// How "grassy" is a spot? (grass grows around the edges of the yard and in a few islands)
function grassValue(x, y) {
  const rx = (x - 240) / 230, ry = (y - 140) / 118, r = Math.sqrt(rx * rx + ry * ry);
  const edge = clamp((r - .78) / .5, 0, 1);
  const base = layeredNoise(grassNoise, x, y, 38) * .6 + edge * GROUND.grassEdgeAmount;
  const island = layeredNoise(islandNoise, x + 200, y + 90, 22);
  return Math.max(base, (island - .6) * 3 + .5);
}

// --- 3b. Paint every pixel: packed farmyard dirt, with grass patches ---
const isGrassPixel = new Uint8Array(WIDTH * HEIGHT);
for (let y = 0; y < HEIGHT; y++) {
  for (let x = 0; x < WIDTH; x++) {
    if (grassValue(x, y) + (staticRandom() - .5) * .07 > GROUND.grassThreshold) {
      isGrassPixel[y * WIDTH + x] = 1;
      const g = layeredNoise(grassNoise, x + 9, y + 9, 9);
      ground.fillStyle = GRASS_SHADES[clamp(Math.floor((g - .25) * 8 + (staticRandom() - .5) * 1.6), 0, 4)];
    } else {
      const d = layeredNoise(dirtNoise, x, y, 30);
      ground.fillStyle = DIRT_SHADES[clamp(Math.floor((d - .2) * 7.5 + (staticRandom() - .5) * 1.6), 0, 4)];
    }
    ground.fillRect(x, y, 1, 1);
  }
}
// specks of dark soil and light dust on the dirt
for (let i = 0; i < 2600; i++) {
  const x = staticRandom() * WIDTH | 0, y = staticRandom() * HEIGHT | 0;
  if (isGrassPixel[y * WIDTH + x]) continue;
  ground.fillStyle = i % 3 ? '#85602f' : '#d6b07a';
  ground.fillRect(x, y, 1 + (staticRandom() * 2 | 0), 1);
}

// Find a random spot on dirt (or on grass if onGrass is true)
function randomSpot(onGrass) {
  for (let tries = 0; tries < 60; tries++) {
    const x = 8 + staticRandom() * (WIDTH - 16) | 0, y = 8 + staticRandom() * (HEIGHT - 16) | 0;
    if (!!isGrassPixel[y * WIDTH + x] === onGrass) return [x, y];
  }
  return [WIDTH / 2, HEIGHT / 2];
}

// --- 3c. Wheel ruts: two grooves from the left edge toward the coop, with trampled dirt between ---
const rutCurve = t => {
  const [p0, p1, p2, p3] = GROUND.rutPath, u = 1 - t;
  const f = i => u * u * u * p0[i] + 3 * u * u * t * p1[i] + 3 * u * t * t * p2[i] + t * t * t * p3[i];
  return [f(0), f(1)];
};
const LIGHT = [-.6, -.8];                          // sunlight comes from the top-left
for (let t = 0; t <= 1; t += .0012) {
  const [cx, cy] = rutCurve(t), [nx2, ny2] = rutCurve(t + .003);
  let tx = nx2 - cx, ty = ny2 - cy; const len = Math.hypot(tx, ty) || 1; tx /= len; ty /= len;
  const nx = -ty, ny = tx;                         // sideways direction
  const put = (offset, color, skipChance) => {
    const x = Math.round(cx + nx * offset), y = Math.round(cy + ny * offset);
    if (x < 0 || y < 0 || x >= WIDTH || y >= HEIGHT) return;
    if (skipChance && noise(x, y) % skipChance === 0) return;
    isGrassPixel[y * WIDTH + x] = 0;
    ground.fillStyle = color; ground.fillRect(x, y, 1, 1);
  };
  for (let k = -9; k <= 9; k++) {                  // trampled strip: turn grass into dirt
    const x = Math.round(cx + nx * k), y = Math.round(cy + ny * k);
    if (x >= 0 && y >= 0 && x < WIDTH && y < HEIGHT && isGrassPixel[y * WIDTH + x]) put(k, DIRT_SHADES[1 + noise(x, y) % 2], 0);
  }
  for (const side of [-1, 1]) {                    // the two wheel grooves
    const mid = side * GROUND.rutSpacing;
    put(mid, RUT_DEEP, 7);
    put(mid - 1, RUT_MID, 5); put(mid + 1, RUT_MID, 5);
    const outerLit = (nx * side) * LIGHT[0] + (ny * side) * LIGHT[1] > 0;     // is the outer bank facing the sun?
    const innerLit = -(nx * side) * LIGHT[0] - (ny * side) * LIGHT[1] > 0;
    put(mid + side * 2, outerLit ? RUT_LIT : RUT_MID, 4);
    put(mid - side * 2, innerLit ? RUT_LIT : RUT_MID, 4);
  }
}

// --- 3d. Pebbles (on the dirt) ---

  const angle = staticRandom() * 3.14, length = 3 + staticRandom() * 4;

/* ==========================================================================
   4. CHICKEN LOOKS  –  color palettes + pre-drawn body parts
   ========================================================================== */

// One entry per hen "breed". body/wing/tail/comb are colors, speckled=1 adds dots.
const HEN_PALETTES = [
  { body: '#f3eee2', wing: '#ddd5c2', tail: '#cfc7b3', comb: '#e0382d' },                // white
  { body: '#b8692d', wing: '#9c5222', tail: '#7a3d18', comb: '#d62f27' },                // brown
  { body: '#3a3633', wing: '#2b2826', tail: '#1a3a30', comb: '#d62f27' },                // black
  { body: '#d9b98a', wing: '#a77a48', tail: '#6b4a28', comb: '#d62f27', speckled: 1 },   // speckled tan
  { body: '#a3431f', wing: '#862f14', tail: '#4a1c0c', comb: '#d62f27' },                // red
  { body: '#eadfc9', wing: '#caa86d', tail: '#8c6b3a', comb: '#e0382d', speckled: 1 },   // speckled cream
];

// Roosters: body/wing/tail like hens, plus hackle = golden neck + back feathers, tailShine = glossy tail feathers
const ROOSTER_PALETTES = [
  { body: '#b5481f', wing: '#8c3315', tail: '#1f4d3a', tailShine: '#43b58a', hackle: '#e8a22c', comb: '#d8231f' },   // red-brown, gold neck
  { body: '#2f2b29', wing: '#231f1e', tail: '#1b4a3d', tailShine: '#4fc7a0', hackle: '#d98a2b', comb: '#d8231f' },   // black-green, gold neck
  { body: '#f1ead8', wing: '#d9ceb2', tail: '#e0d6bc', tailShine: '#ffffff', hackle: '#f2c86a', comb: '#d8231f' },   // white, gold neck
];

// Make a darker / lighter version of a hex color
const shadeColor = (hex, factor) => '#' + [1, 3, 5].map(i =>
  Math.round(clamp(parseInt(hex.slice(i, i + 2), 16) * factor, 0, 255)).toString(16).padStart(2, '0')
).join('');

[...HEN_PALETTES, ...ROOSTER_PALETTES].forEach(pal => {     // every palette gets the basic hen sprites first
  pal.outline   = shadeColor(pal.body, .45);
  pal.highlight = shadeColor(pal.body, parseInt(pal.body.slice(1, 3), 16) < 90 ? 1.7 : 1.12);

  // Sprites are drawn once, then stamped (rotated/scaled) every frame.
  pal.sprites = {};

  // Tail: a fan of 5 feathers
  pal.sprites.tail = makeSprite(14, 16, k => {
    const fan = [-.75, -.38, 0, .38, .75];
    for (const a of fan) for (let i = 0; i < 7; i++)
      drawDisc(k, 13 - Math.cos(a) * i * 1.3, 8 + Math.sin(a) * i * 1.3, 2.3 - i * .1, pal.outline);
    for (const a of fan) for (let i = 0; i < 7; i++)
      drawDisc(k, 13 - Math.cos(a) * i * 1.3, 8 + Math.sin(a) * i * 1.3, 1.3, a ? pal.tail : pal.wing);
  });

  // Body: a rounded blob made of 5 circles
  pal.sprites.body = makeSprite(24, 20, k => {
    const blobs = [[-4, 3.9], [-1, 5], [2, 5], [5, 4.3], [8, 2.6]];
    for (const [x, r] of blobs) drawDisc(k, 12 + x, 10, r + 1, pal.outline);
    for (const [x, r] of blobs) drawDisc(k, 12 + x, 10, r, pal.body);
    drawDisc(k, 12, 9, 2.8, pal.highlight);
    drawDisc(k, 17, 10, 2, pal.highlight);
    if (pal.speckled) for (let i = 0; i < 9; i++) {
      k.fillStyle = pal.tail;
      k.fillRect(8 + staticRandom() * 10 | 0, 6 + staticRandom() * 8 | 0, 1, 1);
    }
  });

  // Wing (one sprite, used for both sides)
  pal.sprites.wing = makeSprite(15, 8, k => {
    for (let i = 0; i < 6; i++) drawDisc(k, 13 - i * 1.7, 4, 3.7 - i * .15, pal.outline);
    for (let i = 0; i < 6; i++) drawDisc(k, 13 - i * 1.7, 4, 2.7 - i * .15, i > 3 ? pal.tail : pal.wing);
    k.fillStyle = pal.tail;
    for (const x of [8, 5]) k.fillRect(x, 2, 1, 5);
  });

  // Head with comb, beak and eyes
  pal.sprites.head = makeSprite(12, 12, k => {
    drawDisc(k, 5, 6, 3.5, pal.outline);
    drawDisc(k, 5, 6, 2.6, pal.body);
    for (const x of [4, 5.5, 7]) drawDisc(k, x, 6, 1, pal.comb);   // comb
